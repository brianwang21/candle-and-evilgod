<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>武器詳情 · 蠟燭與邪神</title>
  <link rel="icon" href="images/Alaya/Alaya_Icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--left"></div>
  <div class="bg-glow bg-glow--right"></div>

  <header class="navbar">
    <nav class="navbar__inner">
      <a href="index.html#characters" class="navbar__link navbar__link--left">← 返回能力區</a>
    </nav>
  </header>

  <main>
    <section class="weapon-detail" id="weapon-detail"></section>
  </main>

  <div
    class="weapon-related-modal"
    id="weapon-related-modal"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="weapon-related-modal-title"
  >
    <div class="weapon-related-modal__backdrop" data-weapon-related-close></div>
    <div class="weapon-related-modal__panel">
      <button
        type="button"
        class="weapon-related-modal__close"
        data-weapon-related-close
        aria-label="關閉相關詳情"
      >
        ×
      </button>
      <div class="weapon-related-modal__body" id="weapon-related-modal-body"></div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 蠟燭與邪神 · Candle and EvilGod</p>
  </footer>

  <script src="site-path.js"></script>
  <script src="characters-data.js"></script>
  <script src="weapons-data.js"></script>
  <script>
    (function () {
      const container = document.getElementById('weapon-detail');
      const id = location.hash.slice(1) || new URLSearchParams(location.search).get('id');
      const weapon = getWeaponById(id);
      const users = weapon ? getCharactersByWeapon(weapon.id) : [];
      const userIds = users.map((character) => character.id);
      const backCharacterId = resolveProfileCharacterId(userIds);
      const backHref = backCharacterId
        ? getCharacterProfileHref(backCharacterId, 'abilities')
        : 'index.html#characters';

      const backLinkLeft = document.querySelector('.navbar__link--left');
      if (backLinkLeft) {
        backLinkLeft.href = backHref;
        backLinkLeft.textContent = backCharacterId ? '← 返回能力區' : '← 返回人物設定';
      }

      if (!weapon) {
        container.innerHTML = `
          <h2 class="section-title">
            <span class="section-title__icon">◈</span>
            武器詳情
          </h2>
          <div class="weapon-detail__empty">
            <p>找不到對應的武器資料。</p>
            <a href="${backHref}" class="weapon-detail__back">${
              backCharacterId ? '返回能力區' : '返回人物設定'
            }</a>
          </div>
        `;
        document.title = '武器詳情 · 蠟燭與邪神';
        return;
      }

      document.title = `${weapon.name} · 武器詳情`;

      const iconHref = getCharacterIcon(backCharacterId);
      const iconLink = document.querySelector('link[rel="icon"]');
      if (iconLink && iconHref) iconLink.href = iconHref;

      const summaryHtml = renderWeaponSummary(weapon.summary);
      const relatedHtml = renderWeaponRelated(weapon.related);
      const relatedModal = document.getElementById('weapon-related-modal');
      const relatedBody = document.getElementById('weapon-related-modal-body');
      let relatedClosing = false;
      let relatedCloseTimer = 0;

      function closeRelatedModal() {
        if (
          !relatedModal ||
          relatedModal.hidden ||
          relatedClosing ||
          !relatedModal.classList.contains('is-open')
        ) {
          return;
        }

        relatedClosing = true;
        relatedModal.classList.remove('is-open');
        relatedCloseTimer = window.setTimeout(() => {
          relatedModal.hidden = true;
          relatedClosing = false;
        }, 280);
      }

      function openRelatedModal(item) {
        if (!relatedModal || !relatedBody || !item) return;
        window.clearTimeout(relatedCloseTimer);
        relatedClosing = false;
        relatedBody.innerHTML = renderWeaponRelatedDetail(item);
        relatedModal.hidden = false;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            relatedModal.classList.add('is-open');
          });
        });
      }

      container.innerHTML = `
        <h2 class="section-title">
          <span class="section-title__icon">◈</span>
          持有武器
        </h2>
        <div class="weapon-detail__card">
          <div class="weapon-detail__media">
            <img
              src="${weapon.image}"
              alt="${weapon.name}"
              class="weapon-detail__img"
            >
          </div>
          <div class="weapon-detail__info">
            <h1 class="weapon-detail__name">${weapon.name}</h1>
            <p class="weapon-detail__caption">${weapon.hoverText}</p>
            <div class="weapon-detail__body">
              ${summaryHtml}
            </div>
            ${relatedHtml}
          </div>
        </div>
      `;

      container.querySelectorAll('[data-weapon-related-id]').forEach((button) => {
        button.addEventListener('click', () => {
          const related = getWeaponRelatedById(
            weapon,
            button.getAttribute('data-weapon-related-id')
          );
          if (related) openRelatedModal(related);
        });
      });

      if (relatedModal) {
        relatedModal.querySelectorAll('[data-weapon-related-close]').forEach((el) => {
          el.addEventListener('click', closeRelatedModal);
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeRelatedModal();
        });
      }
    })();
  </script>
</body>
</html>
