<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>命運之輪 · 主線《蠟燭與邪神》</title>
  <link rel="icon" href="../../../images/Alaya/Alaya_Icon.png" type="image/png">
  <link rel="stylesheet" href="../../../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .story-wheel-lock {
      box-sizing: border-box;
      width: min(100%, 20rem);
      max-width: 20rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015)),
        rgba(8, 8, 8, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .story-wheel-lock *,
    .story-wheel-lock *::before,
    .story-wheel-lock *::after {
      box-sizing: border-box;
    }

    .story-wheel-lock__title {
      margin: 0 0 0.35rem;
      font-family: var(--font-display, Orbitron, sans-serif);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
      color: #ffffff;
    }

    .story-wheel-lock__hint {
      margin: 0 0 1.35rem;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-align: center;
      color: rgba(255, 255, 255, 0.42);
    }

    .story-wheel-lock__slots {
      display: grid !important;
      grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
      gap: 0.45rem;
      width: 100%;
      margin: 0 0 1.5rem;
    }

    .story-wheel-lock__slot {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 2.6rem;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.35);
      font-family: var(--font-display, Orbitron, sans-serif);
      font-size: 1.15rem;
      line-height: 1;
      color: rgba(255, 255, 255, 0.88);
    }

    .story-wheel-lock__slot.is-filled {
      border-color: rgba(229, 57, 53, 0.55);
      background: rgba(229, 57, 53, 0.1);
    }

    .story-wheel-lock__pad {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 0.55rem;
      width: 100%;
      margin: 0 0 0.9rem;
    }

    .story-wheel-lock__key,
    .story-wheel-lock__clear,
    .story-wheel-lock__submit {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0;
      background: rgba(255, 255, 255, 0.04);
      color: #f0f0f0;
      font-family: var(--font-display, Orbitron, sans-serif);
      cursor: pointer;
    }

    .story-wheel-lock__key {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3.2rem;
      aspect-ratio: 1;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .story-wheel-lock__key:hover,
    .story-wheel-lock__key:focus-visible,
    .story-wheel-lock__clear:hover,
    .story-wheel-lock__clear:focus-visible,
    .story-wheel-lock__submit:hover:not(:disabled),
    .story-wheel-lock__submit:focus-visible:not(:disabled) {
      border-color: rgba(229, 57, 53, 0.65);
      background: rgba(229, 57, 53, 0.1);
      color: #fff;
      outline: none;
    }

    .story-wheel-lock__actions {
      display: grid !important;
      grid-template-columns: 3.2rem minmax(0, 1fr) !important;
      gap: 0.55rem;
      width: 100%;
    }

    .story-wheel-lock__clear,
    .story-wheel-lock__submit {
      display: flex !important;
      align-items: center;
      justify-content: center;
      min-height: 2.85rem;
      width: 100%;
    }

    .story-wheel-lock__clear {
      font-size: 1.15rem;
      line-height: 1;
    }

    .story-wheel-lock__submit {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
    }

    .story-wheel-lock__submit:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .story-wheel-lock__feedback {
      min-height: 1.4em;
      margin: 1rem 0 0;
      font-family: 'Noto Serif TC', 'Songti TC', serif;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-align: center;
      color: rgba(255, 255, 255, 0.55);
    }

    @media (max-width: 480px) {
      .story-wheel-lock {
        width: 100%;
        max-width: 20rem;
        padding: 1.15rem 0.85rem 1.35rem;
      }

      .story-wheel-lock__slot,
      .story-wheel-lock__key,
      .story-wheel-lock__clear,
      .story-wheel-lock__submit {
        min-height: 2.75rem;
      }
    }
  </style>
</head>
<body class="story-page story-page--chapter">
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--left"></div>
  <div class="bg-glow bg-glow--right"></div>

  <header class="navbar navbar--story">
    <nav class="navbar__inner">
      <a href="../Main_Story_CandleAndEvilGod.html" class="navbar__link navbar__link--left">← 返回章節一覽</a>
    </nav>
  </header>

  <main class="story-chapter-hub">
    <p class="story-chapter-hub__eyebrow">Chapter 10 · X</p>
    <h1 class="story-chapter-hub__title">命運之輪</h1>
    <p class="story-chapter-hub__en">Wheel of Fortune</p>

    <section class="story-wheel-lock" aria-labelledby="wheel-lock-title">
      <h2 id="wheel-lock-title" class="story-wheel-lock__title">輸入密碼</h2>
      <p class="story-wheel-lock__hint">請輸入六位數字後按下 →</p>

      <div
        class="story-wheel-lock__slots"
        id="wheel-lock-slots"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-label="已輸入 0 位，共 6 位"
      >
        <div class="story-wheel-lock__slot" data-slot="0"></div>
        <div class="story-wheel-lock__slot" data-slot="1"></div>
        <div class="story-wheel-lock__slot" data-slot="2"></div>
        <div class="story-wheel-lock__slot" data-slot="3"></div>
        <div class="story-wheel-lock__slot" data-slot="4"></div>
        <div class="story-wheel-lock__slot" data-slot="5"></div>
      </div>

      <div class="story-wheel-lock__pad" role="group" aria-label="數字鍵盤">
        <button type="button" class="story-wheel-lock__key" data-digit="1">1</button>
        <button type="button" class="story-wheel-lock__key" data-digit="2">2</button>
        <button type="button" class="story-wheel-lock__key" data-digit="3">3</button>
        <button type="button" class="story-wheel-lock__key" data-digit="4">4</button>
        <button type="button" class="story-wheel-lock__key" data-digit="5">5</button>
        <button type="button" class="story-wheel-lock__key" data-digit="6">6</button>
        <button type="button" class="story-wheel-lock__key" data-digit="7">7</button>
        <button type="button" class="story-wheel-lock__key" data-digit="8">8</button>
        <button type="button" class="story-wheel-lock__key" data-digit="9">9</button>
      </div>

      <div class="story-wheel-lock__actions">
        <button type="button" class="story-wheel-lock__clear" id="wheel-lock-clear" aria-label="刪除一位">⌫</button>
        <button type="button" class="story-wheel-lock__submit" id="wheel-lock-submit" disabled aria-label="確認輸入">→</button>
      </div>

      <p class="story-wheel-lock__feedback" id="wheel-lock-feedback" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer footer--story">
    <p>© 2026 蠟燭與邪神 · 命運之輪</p>
  </footer>

  <script>
    (function () {
      const MAX_LEN = 6;
      // 目前尚無正確答案；之後可在此填入六位數字字串
      const CORRECT_CODE = null;

      const slotsEl = document.getElementById('wheel-lock-slots');
      const feedbackEl = document.getElementById('wheel-lock-feedback');
      const submitBtn = document.getElementById('wheel-lock-submit');
      const clearBtn = document.getElementById('wheel-lock-clear');
      const padEl = document.querySelector('.story-wheel-lock__pad');
      const slotNodes = Array.from(slotsEl.querySelectorAll('.story-wheel-lock__slot'));

      let code = '';

      function render() {
        slotNodes.forEach((slot, i) => {
          const filled = i < code.length;
          slot.classList.toggle('is-filled', filled);
          slot.textContent = filled ? code[i] : '';
        });
        slotsEl.setAttribute('aria-label', '已輸入 ' + code.length + ' 位，共 ' + MAX_LEN + ' 位');
        submitBtn.disabled = code.length !== MAX_LEN;
      }

      function setFeedback(message) {
        feedbackEl.textContent = message || '';
      }

      function appendDigit(digit) {
        if (code.length >= MAX_LEN) return;
        code += digit;
        setFeedback('');
        render();
      }

      function clearOne() {
        if (!code.length) return;
        code = code.slice(0, -1);
        setFeedback('');
        render();
      }

      function reject() {
        setFeedback('……沒有反應。');
        code = '';
        render();
      }

      function submit() {
        if (code.length !== MAX_LEN) return;

        if (!CORRECT_CODE) {
          reject();
          return;
        }

        if (code === CORRECT_CODE) {
          setFeedback('已解鎖。');
          // 正解通過後可導向段落頁
          return;
        }

        reject();
      }

      padEl.addEventListener('click', (event) => {
        const key = event.target.closest('[data-digit]');
        if (!key || !padEl.contains(key)) return;
        appendDigit(key.getAttribute('data-digit'));
      });

      clearBtn.addEventListener('click', clearOne);
      submitBtn.addEventListener('click', submit);

      document.addEventListener('keydown', (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;

        if (event.key >= '1' && event.key <= '9') {
          event.preventDefault();
          appendDigit(event.key);
          return;
        }

        if (event.key === 'Backspace') {
          event.preventDefault();
          clearOne();
          return;
        }

        if (event.key === 'Enter') {
          event.preventDefault();
          submit();
        }
      });

      render();
    })();
  </script>
  <script src="../../../site-nav.js"></script>
</body>
</html>
